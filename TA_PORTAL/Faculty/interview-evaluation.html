<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Interview Evaluation - TA Portal</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="app-shell" data-role="Faculty" data-page="faculty-interview-evaluation">
    <nav class="navbar">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-mortarboard-fill"></i>
        TA Portal
      </a>

      <div class="navbar-nav">
        <div class="nav-profile">
          <i class="bi bi-person-circle"></i>
          <span id="navProfileName">Loading...</span>
        </div>

        <a class="nav-link" href="index.html"> Dashboard </a>

        <a class="nav-link active" href="applicants.html"> Applicants </a>

        <a class="nav-link" href="ta-evaluation.html"> TA Evaluation </a>

        <a class="btn-danger" href="#" id="logoutBtn">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </a>
      </div>
    </nav>

    <main>
      <div class="page-container narrow">
        <!-- Page Header -->
        <section class="custom-card page-banner">
          <div>
            <h2>Interview Evaluation</h2>

            <p>
              Evaluate the candidate after the scheduled interview. Each
              category is scored from 1 to 5. Total score is out of 20.
            </p>
          </div>

          <span class="term-badge"> Fall 2026 </span>
        </section>

        <!-- Evaluation Form -->
        <section class="custom-card">
          <form id="interviewEvaluationForm">
            
            <!-- Candidate -->
            <div class="form-group">
              <label class="form-label" for="evaluationCandidate">
                Interviewed Candidate
              </label>
              <select id="evaluationCandidate" class="form-select" required></select>
            </div>

            <!-- Course + Section -->
            <div class="grid-2">
              <div>
                <label class="form-label" for="evaluationCourse">
                  Course
                </label>

                <input id="evaluationCourse" class="form-control readonly-field" readonly/>
              </div>

              <div>
                <label class="form-label" for="evaluationSection">
                  Section
                </label>

                <input id="evaluationSection" class="form-control readonly-field" readonly/>
              </div>
            </div>

            <!-- Interview Date + CGPA -->
            <div class="grid-2">
              <div>
                <label class="form-label" for="evaluationDate">
                  Interview Date
                </label>

                <input
                  id="evaluationDate"
                  class="form-control readonly-field"
                  readonly
                />
              </div>

              <div>
                <label class="form-label" for="evaluationCgpa">
                  Candidate CGPA
                </label>

                <input
                  id="evaluationCgpa"
                  class="form-control readonly-field"
                  readonly
                />
              </div>
            </div>

            <!-- Interview Scores -->
            <div class="grid-2">

              <!-- Technical Knowledge -->
              <div>
                <label class="form-label" for="technical">
                  Technical Knowledge
                </label>
                <input id="technical" type="number" min="1" max="5" step="1" class="form-control" placeholder="1-5" required/>
              </div>

              <!-- Problem Solving -->
              <div>
                <label class="form-label" for="problem">
                  Problem Solving
                </label>
                <input id="problem" type="number" min="1" max="5" step="1" class="form-control" placeholder="1-5" required/>
              </div>

              <!-- Communication -->
              <div>
                <label class="form-label" for="communication">
                  Communication
                </label>
                <input id="communication" type="number" min="1" max="5" step="1" class="form-control" placeholder="1-5" required/>
              </div>

              <!-- Teaching Ability -->
              <div>
                <label class="form-label" for="teaching">
                  Teaching Ability
                </label>
                <input id="teaching" type="number" min="1" max="5" step="1" class="form-control" placeholder="1-5" required/>
              </div>
            </div>

            <!-- Total Score -->
            <div class="form-group">
              <label class="form-label" for="evaluationTotal">
                Total Score
              </label>

              <input
                id="evaluationTotal"
                class="form-control readonly-field"
                value=""
                placeholder="Total will be calculated out of 20"
                readonly
              />
            </div>

            <!-- Comments -->
            <div class="form-group">
              <label class="form-label" for="evaluationComments">
                Comments
              </label>

              <textarea id="evaluationComments" rows="5" placeholder="Enter interview comments..."></textarea>
            </div>

            <!-- Actions -->
            <div class="detail-actions">
              <a class="btn-secondary" href="applicants.html"> Cancel </a>

              <button class="btn-outline-danger" type="button" id="markFailed">
                Mark as Failed
              </button>

              <button class="btn-success" type="button" id="markPassed">
                Mark as Passed
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer>
      <div class="container-wide">
        © 2026 TA Portal | TA Recruitment &amp; Management Portal. All Rights
        Reserved.
      </div>
    </footer>

    <script type="module" src="../assets/js/faculty.js"></script>
  </body>
</html>
