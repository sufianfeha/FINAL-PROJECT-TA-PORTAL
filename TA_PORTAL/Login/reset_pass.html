<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - TA Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="login-page">
    
    <main class="auth-box narrow">
        <div class="brand-wrapper">
            <a class="brand-link" href="landing.html">TA Recruitment &amp; Management Portal</a>
        </div>
        <h1>Reset Password</h1>
        <p class="auth-subtitle">Enter your institutional email address. Password-reset delivery will be connected to
            the backend later.</p>

        <form id="resetForm">
            <label class="form-label" for="resetEmail">Institutional Email</label>
            <input id="resetEmail" type="email" placeholder="student@university.edu" required>

            <button class="btn-primary auth-submit" type="submit">Send Reset Link</button>
        </form>

        <div class="text-center" style="margin-top:14px">
            <a href="signin.html" class="text-primary small-text"><i class="bi bi-arrow-left"></i> Back to Sign In</a>
        </div>
    </main>
    
    <script type="module" src="../assets/js/auth.js"></script>
</body>

</html>
